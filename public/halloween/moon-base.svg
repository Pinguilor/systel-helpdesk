<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
<defs>
<clipPath id="disc"><circle cx="500" cy="500" r="500"/></clipPath>
<clipPath id="rimclip"><rect x="-200" y="-200" width="200" height="200"/><rect x="-200" y="-200" width="400" height="30" /></clipPath>
<radialGradient id="base" cx="40%" cy="36%" r="72%"><stop offset="0" stop-color="#fffef9"/><stop offset=".55" stop-color="#ece8dc"/><stop offset="1" stop-color="#bdb8a8"/></radialGradient>
<radialGradient id="cr" cx="42%" cy="42%" r="60%"><stop offset="0" stop-color="#8d8878" stop-opacity=".10"/><stop offset=".7" stop-color="#7d7868" stop-opacity=".26"/><stop offset=".92" stop-color="#5f5a4c" stop-opacity=".42"/><stop offset="1" stop-color="#5f5a4c" stop-opacity="0"/></radialGradient>
<radialGradient id="limb" cx="50%" cy="50%" r="50%"><stop offset=".62" stop-color="#2b2540" stop-opacity="0"/><stop offset=".92" stop-color="#2b2540" stop-opacity=".38"/><stop offset="1" stop-color="#1a1530" stop-opacity=".62"/></radialGradient>
<radialGradient id="lit" cx="35%" cy="32%" r="65%"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .43  0 0 0 0 .38  0 0 0 .22 0"/></filter>
<filter id="mottle"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .42  0 0 0 .55 -.18"/></filter>
</defs>
<g clip-path="url(#disc)">
<rect width="1000" height="1000" fill="url(#base)"/>
<rect width="1000" height="1000" filter="url(#mottle)" opacity=".5"/>


<rect width="1000" height="1000" filter="url(#grain)"/>
<rect width="1000" height="1000" fill="url(#lit)"/>
<rect width="1000" height="1000" fill="url(#limb)"/>
</g></svg>